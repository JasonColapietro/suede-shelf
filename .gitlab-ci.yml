# Suede Shelf delivery pipeline.
# Stages map to GitLab's DevSecOps lifecycle; Duo Agent Platform flows
# (.gitlab/duo/flows/) react to the events this pipeline produces.

stages: [build, test, package, deploy, monitor, release]

variables:
  NODE_IMAGE: node:22-bookworm-slim
  IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  CS_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA   # container scanning target
  GCP_REGION: us-central1
  AR_IMAGE: $GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/shelf/web:$CI_COMMIT_SHORT_SHA

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

include:
  # secure
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.v2.gitlab-ci.yml
  - template: Jobs/Container-Scanning.gitlab-ci.yml

.node:
  image: $NODE_IMAGE
  cache:
    key: { files: [package-lock.json], prefix: npm }
    paths: [.npm]
  before_script:
    - npm ci --cache .npm --prefer-offline --ignore-scripts

# ---------- verify ----------

typecheck:
  extends: .node
  stage: build
  script:
    - npx next typegen
    - npm run typecheck

unit-tests:
  extends: .node
  stage: test
  script:
    - node --import tsx --test --test-reporter=spec --test-reporter=junit --test-reporter-destination=stdout --test-reporter-destination=junit.xml test/*.test.ts
  artifacts:
    when: always
    reports: { junit: junit.xml }

next-build:
  extends: .node
  stage: build
  script:
    - npm run build
  artifacts:
    expire_in: 1 day
    paths: [.next/standalone, .next/static]

# govern: the Payment Guard flow labels risky MRs; a blocked MR cannot pass its pipeline.
payment-safety-gate:
  stage: test
  image: alpine:3.20
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - |
      case ",$CI_MERGE_REQUEST_LABELS," in
        *",payment-safety::blocked,"*)
          echo "Payment Guard blocked this merge request. Read its review note, fix the finding, then remove the label."
          exit 1 ;;
      esac
      echo "No payment-safety block on this merge request."

# ---------- package ----------

container-image:
  stage: package
  image: docker:27-cli
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build --build-arg DEMO_STORE_ID="$DEMO_STORE_ID" -t "$IMAGE" .
    - docker push "$IMAGE"

container_scanning:
  needs: [container-image]

# ---------- configure + deploy (Google Cloud Run, keyless via Workload Identity Federation) ----------

.gcp:
  image: google/cloud-sdk:slim
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://iam.googleapis.com/projects/$GCP_PROJECT_NUMBER/locations/global/workloadIdentityPools/$GCP_WIF_POOL/providers/$GCP_WIF_PROVIDER
  before_script:
    - echo "$GITLAB_OIDC_TOKEN" > .oidc_token
    - >
      gcloud iam workload-identity-pools create-cred-config
      "projects/$GCP_PROJECT_NUMBER/locations/global/workloadIdentityPools/$GCP_WIF_POOL/providers/$GCP_WIF_PROVIDER"
      --service-account="$GCP_DEPLOYER_SA" --credential-source-file=.oidc_token --output-file=.gcp_creds.json
    - gcloud auth login --cred-file=.gcp_creds.json --quiet
    - gcloud config set project "$GCP_PROJECT_ID" --quiet
    - curl -sL https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_x86_64.tar.gz | tar -xz -C /usr/local/bin crane

.deploy:
  extends: .gcp
  stage: deploy
  needs: [container-image, unit-tests]
  script:
    - crane auth login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
    - crane auth login "$GCP_REGION-docker.pkg.dev" -u oauth2accesstoken -p "$(gcloud auth print-access-token)"
    - crane copy "$IMAGE" "$AR_IMAGE"
    # configure: runtime settings and secrets come from Secret Manager, never from the repo.
    - >
      gcloud run deploy "$SERVICE" --image "$AR_IMAGE" --region "$GCP_REGION"
      --service-account "$GCP_RUNTIME_SA" --allow-unauthenticated --port 8080 --memory 512Mi --max-instances 3
      --set-env-vars "PAYPAL_ENV=sandbox,PUBLIC_BASE_URL=$BASE_URL,DEMO_STORE_ID=$DEMO_STORE_ID"
      --set-secrets "PAYPAL_CLIENT_ID=paypal-client-id:latest,PAYPAL_CLIENT_SECRET=paypal-client-secret:latest,ANTHROPIC_API_KEY=anthropic-api-key:latest,KV_REST_API_URL=kv-rest-api-url:latest,KV_REST_API_TOKEN=kv-rest-api-token:latest"
      --labels "gitlab-pipeline=$CI_PIPELINE_ID,commit=$CI_COMMIT_SHORT_SHA"
    - echo "DEPLOYED_URL=$(gcloud run services describe "$SERVICE" --region "$GCP_REGION" --format='value(status.url)')" >> deploy.env
  artifacts:
    reports: { dotenv: deploy.env }

deploy-staging:
  extends: .deploy
  variables: { SERVICE: shelf-staging, BASE_URL: $STAGING_URL }
  environment: { name: staging, url: $STAGING_URL, deployment_tier: staging }
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy-production:
  extends: .deploy
  variables: { SERVICE: shelf-production, BASE_URL: $PRODUCTION_URL }
  environment: { name: production, url: $PRODUCTION_URL, deployment_tier: production }
  needs: [container-image, unit-tests, smoke-staging]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual   # protected environment with a required approval (govern)

# ---------- monitor ----------

.smoke:
  image: $NODE_IMAGE
  stage: monitor
  script:
    - node scripts/smoke.mjs "$DEPLOYED_URL" "$DEMO_STORE_ID" --checkout

smoke-staging:
  extends: .smoke
  needs: [deploy-staging]
  environment: { name: staging, action: verify }
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

smoke-production:
  extends: .smoke
  needs: [deploy-production]
  environment: { name: production, action: verify }
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Scheduled synthetic check of production (CI/CD > Schedules, variable SYNTHETIC=1).
synthetic-check:
  image: $NODE_IMAGE
  stage: monitor
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SYNTHETIC == "1"
  script:
    - node scripts/smoke.mjs "$PRODUCTION_URL" "$DEMO_STORE_ID" --checkout

# ---------- release ----------

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  script:
    # The Release Scribe flow writes RELEASE_NOTES.md in an MR before tagging; fall back to the commit log.
    - test -s RELEASE_NOTES.md || git log --pretty="- %s" -20 > RELEASE_NOTES.md
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Suede Shelf $CI_COMMIT_TAG"
    description: ./RELEASE_NOTES.md
